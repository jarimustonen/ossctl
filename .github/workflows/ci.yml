name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - name: Verify the CI toolchain matches the repository pin
        run: |
          pin=$(awk -F '"' '/^channel = / { print $2 }' rust-toolchain.toml)
          test -n "$pin"
          test "$(rustc --version | cut -d ' ' -f 2)" = "$pin"
          bad_refs=$(grep -oE 'dtolnay/rust-toolchain@[0-9A-Za-z._-]+' .github/workflows/ci.yml \
            | grep -Fvx "dtolnay/rust-toolchain@$pin" \
            | grep -Fvx 'dtolnay/rust-toolchain@1.85' || true)
          test -z "$bad_refs" || { echo "unexpected Rust toolchain refs: $bad_refs"; exit 1; }
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      # Cache the cargo registry + git db only. We deliberately do NOT cache
      # target/ via actions/cache: its key has no rustc-version component, so a
      # toolchain bump would restore a stale incremental tree.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      # Don't cancel the macOS run when ubuntu fails (and vice-versa) —
      # platform-specific regressions are exactly what this matrix is for.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo test --locked --workspace

  msrv:
    name: msrv (1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-msrv-
      # Verify the declared rust-version actually builds (dev profile → keeps
      # debug-assertions / overflow checks in the type/borrow check).
      - run: cargo check --locked --workspace --all-targets

  skill-lockstep:
    name: skill↔CLI lockstep (§17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      # §17 release-blocker gate: every bundled skill's referenced subcommands /
      # flags must exist against the live `--help`, the version token must be
      # substituted, and install+print are golden-tested. The `test` job already
      # runs these; this named job makes the lockstep guarantee an explicit,
      # required check rather than one buried in the full suite.
      - run: cargo test --locked -p shipshape --test skill --test skill_lockstep

  doc:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      # Guards the shipshape-core #![warn(missing_docs)] investment: fails on
      # missing docs or broken intra-doc links.
      - run: cargo doc --locked --workspace --no-deps
