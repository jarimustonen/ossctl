name: Publish to crates.io

# Triggers on the version-tag push (the SAME tag cargo-dist's release.yml keys
# off), so crates.io publishing happens in CI with no dependency on a local
# token. Requires a CARGO_REGISTRY_TOKEN repo secret with publish scope
# (set it in this repository's Actions secrets).
#
# NOTE: we do NOT trigger on `release: published`. cargo-dist creates the GitHub
# Release with the default GITHUB_TOKEN, and GitHub does not emit workflow events
# (incl. `release`) for actions taken by GITHUB_TOKEN — so a `release`-triggered
# job never fires on a real cargo-dist cut. Keying off the tag push is the
# verified working trigger. This runs in parallel with release.yml (the crates
# publish needs only the tagged source, not the built binaries).
#
# The registry packages are dependency-ordered: `shipshape-core`, then
# `shipshape-cli`. The recovery tree marks the already-published 0.11.0 core as
# `publish = false`, so this workflow derives core eligibility from Cargo metadata
# and skips it until the steady-state cleanup restores publication. Modern `cargo
# publish` waits for a newly published crate to appear on the index before returning;
# the explicit retry loop remains belt-and-suspenders for propagation lag.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run cargo publish --dry-run instead of publishing"
        required: false
        default: "false"

jobs:
  publish:
    name: cargo publish (workspace, dep-order)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify
        run: cargo build --release

      - name: Publish (dry-run)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry-run == 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          core_publishable="$(jq -r --arg pkg shipshape-core '
            [.packages[] | select(.name == $pkg)] as $matches
            | if ($matches | length) != 1 then
                error("expected exactly one shipshape-core package")
              else
                $matches[0].publish == null
                or ($matches[0].publish | index("crates-io") != null)
              end
          ' <<<"$metadata")"
          if [ "$core_publishable" = true ]; then
            cargo publish --locked -p shipshape-core --dry-run
          else
            # Recovery: core 0.11.0 is already indexed and intentionally disabled.
            cargo publish --locked -p shipshape-cli --dry-run
          fi

      - name: Publish (dep-order)
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry-run != 'true') }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          # Publish a crate, tolerating "already exists on crates.io index" as
          # success. The engine (`shipshape release cut`) publishes both crates
          # directly, and the version-tag push ALSO triggers this workflow, so a
          # crate version is frequently already on the index by the time CI runs.
          # A plain `cargo publish` exits 101 in that case; under `set -e` that
          # would abort the step and mark a fully-successful release RED. Any
          # OTHER failure (network, auth, verification) still propagates.
          publish() {
            local pkg="$1"
            local out rc
            # Capture combined output and the real exit code. The command
            # substitution is its own statement (not `local out=$(…)`, which
            # would mask cargo's status), and the `if` keeps the failure out of
            # `set -e`'s reach.
            if out="$(CARGO_TERM_COLOR=never cargo publish --locked -p "$pkg" 2>&1)"; then
              rc=0
            else
              rc=$?
            fi
            printf '%s\n' "$out"
            if [ "$rc" -eq 0 ]; then
              return 0
            fi
            # Tolerate ONLY cargo's exact duplicate-version diagnostic for THIS
            # package, e.g. "error: crate shipshape-core@0.2.4 already exists on
            # crates.io index". A here-string (not a pipe) avoids a pipefail
            # SIGPIPE false-negative from grep -q closing the pipe early. Any
            # other failure (network, auth, verification) still propagates.
            if grep -Eqi "crate ${pkg}@[^[:space:]]+ already exists on crates\.io index" <<<"$out"; then
              echo "$pkg already on the crates.io index — treating as success."
              return 0
            fi
            return "$rc"
          }

          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          core_publishable="$(jq -r --arg pkg shipshape-core '
            [.packages[] | select(.name == $pkg)] as $matches
            | if ($matches | length) != 1 then
                error("expected exactly one shipshape-core package")
              else
                $matches[0].publish == null
                or ($matches[0].publish | index("crates-io") != null)
              end
          ' <<<"$metadata")"
          if [ "$core_publishable" = true ]; then
            echo "Publishing shipshape-core…"
            publish shipshape-core
          else
            echo "Skipping shipshape-core: this tree marks it publish=false."
          fi

          echo "Publishing shipshape-cli…"
          for attempt in 1 2 3 4 5 6; do
            if publish shipshape-cli; then
              echo "shipshape-cli published."
              exit 0
            fi
            echo "attempt $attempt failed; waiting 30s for registry visibility…"
            sleep 30
          done
          echo "shipshape-cli failed to publish after retries" >&2
          exit 1
