[workspace]
members = ["cargo:."]

# Config for 'dist' (cargo-dist). shipshape is a portable, POSIX-friendly CLI
# (no fork/tmux/signal machinery), so the target set is broad. The tag-triggered
# `.github/workflows/release.yml` is GENERATED from this [dist] section via
# `dist generate` — edit config here, then regenerate; never hand-edit the
# workflow. Only the non-published Cargo package in `crates/shipshape-dist` is
# marked distributable. Its package and binary are both `shipshape`, so cargo-dist
# produces `shipshape-*` archives and `shipshape-installer.sh`; it calls the same
# `shipshape-cli` library entry point as the crates.io-installed binary.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax). Pinned to
# the version this config was generated against so a regenerated workflow and
# the local `dist` stay in lockstep.
cargo-dist-version = "0.28.2"
# CI backend.
ci = "github"
# Installer scripts generated as release assets: curl-to-shell (Unix) only.
# No PowerShell installer — Windows is not a supported platform (see targets).
#
# Homebrew auto-publish is NOT enabled here because the shipshape release ENGINE
# owns the tap write itself (a direct tap-write in the post-tag dist phase, since
# 0.2.3). This is a real division of labour, not a deferral: cargo-dist builds and
# attaches the binaries, the engine renders and pushes the formula against them.
# (The tap write token exists and is not a constraint on either side.)
installers = ["shell"]
# Cross-platform binary matrix (Rust target-triple syntax): macOS and Linux,
# each on arm64 + x86_64. The Linux targets use `musl`, not `gnu`, so the
# binaries are statically linked and run on any distro regardless of its glibc
# vintage — shipshape is pure Rust with no C dependencies, so musl is a clean fit
# and avoids a `GLIBC_x.y not found` cliff on older LTS systems.
#
# NO WINDOWS (maintainer decision, 2026-08-17). Building and shipping a Windows
# binary costs CI time on every release for a platform this fleet does not use.
# Windows is already excluded from the normalizer's default platform set — this
# repo had opted into it explicitly, and that opt-in is now withdrawn.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
]
# The arm64 macOS build uses the repository-local self-hosted runner below. The
# Intel macOS target remains on cargo-dist's GitHub-hosted runner, avoiding an
# unsupported cross-build on the Homebrew-Rust self-host while preserving the
# required prebuilt Intel install path.
# Where to host releases.
hosting = "github"
# Generate GitHub build-provenance attestations for the release artifacts
# (`gh attestation verify`). A native, secret-free supply-chain signal for a CLI
# whose install path is curl-to-shell; cargo-dist scopes the extra `id-token` /
# `attestations` permissions to the publishing job.
github-attestations = true
# `pr-run-mode = skip` drops the PR plan-only job, so the workflow never runs on
# pull requests, and on pushes it fires only on tags. NOTE the tag filter is
# broader than `vX.Y.Z`: cargo-dist emits a semver-shaped glob
# (`**[0-9]+.[0-9]+.[0-9]+*`) that also matches e.g. `pkg/1.2.3`. Glob filtering
# is not an authorization boundary — enforce release-tag discipline (who may
# create `v*` tags, on which commits) with a GitHub tag-protection ruleset.
pr-run-mode = "skip"

# DELIBERATE REPOSITORY-LOCAL INFRA EXCEPTION (not shipshape canon and never
# generated for downstream projects): build macOS arm64 on this repository's
# self-hosted Apple-silicon runner rather than GitHub-hosted macOS. This runner
# is configured only for this repository, and the generic `self-hosted` label is
# intentional because it is the sole self-hosted runner registered here. The
# runner is arm64 and cross-compiles x86_64-apple-darwin. This sub-table MUST
# stay at the end: a `[dist.*]` table placed among `[dist]` scalar keys would
# swallow every following key.
[dist.github-custom-runners]
aarch64-apple-darwin = "self-hosted"
